name: 해외선물 뉴스 크롤링
on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다
  workflow_dispatch:
  push:  # 푸시할 때도 실행 (테스트용)
    branches:
      - main

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: 🕐 실행 시간 로그
      run: |
        echo "======================================"
        echo "🚀 크롤링 시작!"
        echo "🕐 실행 시간 (UTC): $(date -u)"
        echo "🕐 실행 시간 (KST): $(TZ=Asia/Seoul date)"
        echo "======================================"
    
    - name: 코드 체크아웃
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    
    - name: Python 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 의존성 설치
      run: |
        pip install playwright feedparser
        playwright install chromium
        playwright install-deps chromium
    
    - name: 뉴스 크롤링 실행
      run: python futures_news_crawler.py
      env:
        TZ: Asia/Seoul
      continue-on-error: true
    
    - name: Git 설정
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: 결과 커밋 및 푸시
      run: |
        if [ -f "futures_news.json" ]; then
          echo "✅ JSON 파일 생성됨"
          git add futures_news.json
          git diff --staged --quiet || git commit -m "Update futures news - $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push || echo "❌ Push failed"
          echo "✅ 완료!"
        else
          echo "❌ JSON 파일이 생성되지 않았습니다"
        fi
    
    - name: 📊 완료 로그
      run: |
        echo "======================================"
        echo "✅ 모든 작업 완료"
        echo "🕐 종료 시간 (KST): $(TZ=Asia/Seoul date)"
        echo "======================================"
